  <!-- Contact Section -->
  <section class="contact-wrapper">
    <div class="contact-form-panel">
      <h2>Contact Us</h2>
      <p>Have questions or suggestions? Fill out the form and we’ll get back to you!</p>
      <form id="contactForm">
        <input type="text" id="contactName" placeholder="Full Name" required>
        <input type="email" id="contactEmail" placeholder="Email" required>
        <textarea id="contactMessage" placeholder="Your Message" rows="6" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </section>
