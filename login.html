<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - SSC Forum</title>
  <link rel="stylesheet" href="styles.css"> <!-- navbar styles -->
  <link rel="stylesheet" href="auth.css">   <!-- form styles -->
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar__container">
      <a href="index.html" id="navbar__logo">
        <img src="images/ssc-logo.jpg" alt="SSC Logo" class="logo-img"> SSC Forum
      </a>
      <ul class="navbar__menu">
        <li class="navbar__item"><a href="index.html" class="navbar__links">Home</a></li>
        <li class="navbar__item"><a href="events.html" class="navbar__links">Events</a></li>
        <li class="navbar__item"><a href="about.html" class="navbar__links">About</a></li>
        <li class="navbar__item"><a href="forum.html" class="navbar__links">Forum</a></li>
      </ul>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="auth-wrapper">
    <div class="auth-image-panel"></div>
    <div class="auth-form-panel">
      <h2>
        <img src="images/ssc-logo.jpg" alt="Logo"> Login
      </h2>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>

        <button type="submit">Login</button>
      </form>
      <p class="toggle-link">
        Don’t have an account? 
        <a href="signup.html">Sign up here</a> <!-- 🔹 Link to signup page -->
      </p>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
