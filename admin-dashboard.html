<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LSPU SSC | Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar__container">
      <a href="index.html" id="navbar__logo">
        <img src="images/ssc-logo.jpg" alt="SSC Logo" class="logo-img">
        LSPU SSC
      </a>
      <ul class="navbar__menu">
        <li class="navbar__item"><a href="index.html" class="navbar__links">Home</a></li>
        <li class="navbar__item"><a href="about.html" class="navbar__links">About</a></li>
        <li class="navbar__item"><a href="contact.html" class="navbar__links">Contact</a></li>
        <li class="navbar__btn">
          <button id="logoutBtn" class="logout-btn">Logout</button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- ADMIN DASHBOARD -->
  <main class="admin-dashboard">
    <h2 id="adminWelcome">Loading...</h2>

    <!-- USER MANAGEMENT -->
    <div class="admin-tools">
      <h3>📋 User Management</h3>
      <table class="user-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr><td colspan="3" style="text-align:center;">Loading users...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- THREAD MANAGEMENT -->
    <div class="threads-tools">
      <h3>📝 Threads Management</h3>
      <table class="thread-table">
        <thead>
          <tr>
            <th>Author</th>
            <th>Content</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="threadTableBody">
          <tr><td colspan="4" style="text-align:center;">Loading threads...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>&copy; 2025 LSPU Supreme Student Council. All Rights Reserved.</p>
  </footer>

  <!-- Firebase & Admin JS -->
  <script type="module" src="firebase.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
